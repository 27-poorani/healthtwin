<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Reports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .admin-wrap{ margin-top:16px; padding-bottom: 20px; }
        .admin-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
        .admin-toolbar{ display:flex; justify-content: space-between; align-items:flex-start; gap:12px; padding:16px 16px 0 16px; }
        .admin-table{ width:100%; border-collapse: collapse; margin-top: 12px; }
        .admin-table th, .admin-table td{ text-align:left; padding:10px; border-bottom:1px solid rgba(15,23,42,0.08); vertical-align: top; font-size: 13px; }
        .admin-table th{ color: #0f172a; font-weight: 1000; background:#f8fafc; position: sticky; top: 0; }
        .admin-thumb{ width:60px; height:60px; object-fit: cover; border-radius: 12px; border:1px solid rgba(15,23,42,0.08); background:#fff; }
        .admin-badges{ display:flex; gap:8px; flex-wrap:wrap; }
        .admin-select{ padding:8px 10px; border-radius: 12px; border:1px solid rgba(15,23,42,0.12); }
        .admin-danger{ background:#fff1f2; color:#991b1b; border:1px solid rgba(220,38,38,0.22); border-radius: 12px; padding:8px 12px; cursor:pointer; font-weight: 900; }
        .admin-danger:hover{ filter: brightness(0.98); }
        .admin-muted{ color:#64748b; font-weight: 800; font-size: 12px; }
        .admin-container{ overflow:auto; max-height: calc(100vh - 220px); border-top: 1px solid rgba(15,23,42,0.06); margin-top: 10px; }
        .emergency-alert{
            margin: 10px 16px 0 16px;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(220,38,38,0.25);
            background: #fee2e2;
            color: #991b1b;
            font-weight: 900;
            display: none;
        }
        .emergency-wrap{
            margin: 12px 16px 0 16px;
            border: 1px solid rgba(220,38,38,0.22);
            background: #fff5f5;
            border-radius: 12px;
            padding: 12px;
            display: none;
        }
        .emergency-title{
            font-size: 14px;
            font-weight: 1000;
            color:#991b1b;
            margin-bottom: 10px;
        }
        .emergency-list{
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .emergency-item{
            border: 1px solid rgba(220,38,38,0.22);
            background:#fff;
            border-radius: 12px;
            padding: 10px;
            display:grid;
            grid-template-columns: 60px 1fr;
            gap: 10px;
            align-items: start;
        }
        .emergency-meta{ font-size: 12px; color:#475569; line-height: 1.35; font-weight: 800; }
        .emergency-label{
            display:inline-block;
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(220,38,38,0.28);
            background: #fee2e2;
            color:#991b1b;
            font-size: 11px;
            font-weight: 1000;
        }
        .admin-row-emergency{ background: rgba(220,38,38,0.06); }
        .admin-analytics{ margin: 10px 16px 0 16px; border: 1px solid rgba(15,23,42,0.08); border-radius: 12px; padding: 10px; background:#fff; }
        .admin-analytics-title{ font-weight: 1000; font-size: 13px; margin-bottom: 8px; }
        .admin-summary-grid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
        .admin-summary-card{ background:#f8fafc; border:1px solid rgba(15,23,42,0.06); border-radius:12px; padding:10px; }
        .admin-summary-label{ color:#64748b; font-size:12px; font-weight:900; }
        .admin-summary-value{ margin-top:6px; font-weight:1000; font-size:24px; line-height:1; }
        .admin-summary-value.good{ color:#16a34a; }
        .admin-summary-value.bad{ color:#dc2626; }
        .admin-charts{ margin-top: 10px; display:grid; grid-template-columns: 1fr; gap:10px; }
        .admin-chart-card{ background:#fff; border:1px solid rgba(15,23,42,0.06); border-radius:12px; padding:10px; }
        .admin-chart-card canvas{ width:100%; max-height: 220px; }
        @media (min-width: 900px){
            .admin-summary-grid{ grid-template-columns: repeat(4, minmax(0,1fr)); }
            .admin-charts{ grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <nav>
                <a href="/admin/reports" class="nav-link active">Dashboard</a>
                <a href="/admin/cases" class="nav-link">Cases</a>
            </nav>
            <form method="POST" action="/admin/logout" style="margin:0;">
                <button class="logout-btn" type="submit">Logout</button>
            </form>
        </aside>

        <main class="main-content">
            <header class="app-header" style="margin-bottom: 20px;">
                <div class="container header-inner" style="padding: 0;">
                    <div class="header-left">
                        <h1 style="margin: 0;">Admin - Dashboard</h1>
                    </div>
                    <div class="header-right">
                        <a class="header-link" href="/">Back to Detector</a>
                    </div>
                </div>
            </header>

            <div class="admin-wrap">
                <section class="card dashboard-card">
                    <div class="admin-toolbar" style="padding: 0 16px;">
                        <div>
                            <br>
                            <div class="result-title" style="font-size:16px;">Dashboard Overview</div>
                            <div class="card-subtitle">Analytics and key metrics for all reports.</div>
                        </div>
                        <div class="admin-actions">
                            
                            <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
                        </div>
                    </div>

                    <div class="admin-analytics">
                        <div class="admin-analytics-title">Summary</div>
                        <div class="admin-summary-grid">
                            <div class="admin-summary-card">
                                <div class="admin-summary-label">Total reports</div>
                                <div id="adminTotalReports" class="admin-summary-value">-</div>
                            </div>
                            <div class="admin-summary-card">
                                <div class="admin-summary-label">Active cases</div>
                                <div id="adminActiveReports" class="admin-summary-value bad">-</div>
                            </div>
                            <div class="admin-summary-card">
                                <div class="admin-summary-label">In Progress</div>
                                <div id="adminInProgressReports" class="admin-summary-value">-</div>
                            </div>
                            <div class="admin-summary-card">
                                <div class="admin-summary-label">Resolved</div>
                                <div id="adminResolvedReports" class="admin-summary-value good">-</div>
                            </div>
                        </div>
                        <div class="admin-charts">
                            <div class="admin-chart-card">
                                <div class="admin-summary-label">Disease distribution</div>
                                <canvas id="adminDiseaseChart"></canvas>
                            </div>
                            <div class="admin-chart-card">
                                <div class="admin-summary-label">Severity distribution</div>
                                <canvas id="adminSeverityChart"></canvas>
                            </div>
                            <div class="admin-chart-card">
                                <div class="admin-summary-label">Cases by location</div>
                                <canvas id="adminLocationChart"></canvas>
                            </div>
                            <div class="admin-chart-card">
                                <div class="admin-summary-label">Reports over time</div>
                                <canvas id="adminTrendChart"></canvas>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        let adminDiseaseChart = null;
        let adminSeverityChart = null;
        let adminLocationChart = null;
        let adminTrendChart = null;

        async function loadReports(){
            const resp = await fetch("/api/admin/reports");
            if (!resp.ok) {
                const data = await resp.json().catch(()=> ({}));
                throw new Error(data.error || "Failed to load reports");
            }
            const data = await resp.json();
            return data.reports || [];
        }

        function destroyChart(c){ if(c && typeof c.destroy === "function") c.destroy(); }

        function renderAdminAnalytics(reports){
            const rows = Array.isArray(reports) ? reports : [];
            const totalEl = document.getElementById("adminTotalReports");
            const activeEl = document.getElementById("adminActiveReports");
            const inProgEl = document.getElementById("adminInProgressReports");
            const resolvedEl = document.getElementById("adminResolvedReports");
            if(totalEl) totalEl.textContent = String(rows.length);
            const active = rows.filter(r => String((r && r.status) || "") !== "Resolved").length;
            const inProgress = rows.filter(r => String((r && r.status) || "") === "In Progress").length;
            const resolved = rows.filter(r => String((r && r.status) || "") === "Resolved").length;
            if(activeEl) activeEl.textContent = String(active);
            if(inProgEl) inProgEl.textContent = String(inProgress);
            if(resolvedEl) resolvedEl.textContent = String(resolved);

            if(typeof Chart === "undefined") return;
            const diseaseCtx = document.getElementById("adminDiseaseChart");
            const severityCtx = document.getElementById("adminSeverityChart");
            const locationCtx = document.getElementById("adminLocationChart");
            const trendCtx = document.getElementById("adminTrendChart");
            if(!diseaseCtx || !severityCtx || !locationCtx || !trendCtx) return;

            const diseaseCounts = {};
            for(const r of rows){
                const diseases = Array.isArray(r.disease) ? r.disease : (r.disease ? [r.disease] : []);
                for(const d of diseases){
                    const k = String(d || "Unknown").trim() || "Unknown";
                    diseaseCounts[k] = (diseaseCounts[k] || 0) + 1;
                }
            }
            const diseaseLabels = Object.keys(diseaseCounts);
            const diseaseValues = diseaseLabels.map(k => diseaseCounts[k]);

            const severityCounts = { Mild: 0, Moderate: 0, Severe: 0 };
            for(const r of rows){
                const s = String((r && r.severity) || "Mild");
                if(s === "Moderate") severityCounts.Moderate++;
                else if(s === "Severe") severityCounts.Severe++;
                else severityCounts.Mild++;
            }

            const locationCounts = {};
            for(const r of rows){
                const lat = roundCoord(r && r.lat);
                const lng = roundCoord(r && r.lng);
                if(lat === null || lng === null) continue;
                const key = `${lat},${lng}`;
                locationCounts[key] = (locationCounts[key] || 0) + 1;
            }
            const locLabels = Object.keys(locationCounts);
            const locValues = locLabels.map(k => locationCounts[k]);

            const trendCounts = {};
            for(const r of rows){
                const iso = r && r.createdAt;
                if(!iso) continue;
                const d = new Date(iso);
                if(isNaN(d.getTime())) continue;
                const k = d.toISOString().slice(0,10);
                trendCounts[k] = (trendCounts[k] || 0) + 1;
            }
            const trendLabels = Object.keys(trendCounts).sort();
            const trendValues = trendLabels.map(k => trendCounts[k]);

            destroyChart(adminDiseaseChart);
            destroyChart(adminSeverityChart);
            destroyChart(adminLocationChart);
            destroyChart(adminTrendChart);

            if(diseaseLabels.length){
                adminDiseaseChart = new Chart(diseaseCtx, {
                    type: "pie",
                    data: {
                        labels: diseaseLabels,
                        datasets: [{ data: diseaseValues, backgroundColor: ["#22c55e","#3b82f6","#f97316","#e11d48","#6366f1","#14b8a6"] }]
                    },
                    options: { plugins: { legend: { position: "bottom" } } }
                });
            }

            adminSeverityChart = new Chart(severityCtx, {
                type: "bar",
                data: {
                    labels: ["Mild","Moderate","Severe"],
                    datasets: [{ data: [severityCounts.Mild, severityCounts.Moderate, severityCounts.Severe], backgroundColor: ["#22c55e","#eab308","#ef4444"] }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });

            if(locLabels.length){
                adminLocationChart = new Chart(locationCtx, {
                    type: "bar",
                    data: { labels: locLabels, datasets: [{ data: locValues, backgroundColor: "#3b82f6" }] },
                    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
                });
            }

            if(trendLabels.length){
                adminTrendChart = new Chart(trendCtx, {
                    type: "line",
                    data: { labels: trendLabels, datasets: [{ data: trendValues, borderColor: "#0b5ed7", backgroundColor: "rgba(59,130,246,0.18)", fill: true, tension: 0.25 }] },
                    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
                });
            }
        }

        function roundCoord(v){
            const n = Number(v);
            if(!isFinite(n)) return null;
            return Math.round(n * 1000) / 1000;
        }

        async function refresh(){
            try{
                const reports = await loadReports();
                renderAdminAnalytics(reports);
            }catch(e){
                console.error("Error loading reports:", e);
            }
        }

        refreshBtn && refreshBtn.addEventListener("click", refresh);

        refresh();
    </script>
</body>
</html>
