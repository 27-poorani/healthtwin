<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="container header-inner">
            <div class="header-left">
                <h1>Admin Login</h1>
            </div>
            <div class="header-right">
                <a class="header-link" href="/">Back to Detector</a>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top:16px;">
        <section class="card" style="max-width:520px;margin:0 auto;padding:16px;">
            <div class="card-title" style="padding:0 0 10px 0;">
                <h2 style="margin:0;">Sign in</h2>
                <p class="card-subtitle">Hardcoded demo credentials.</p>
            </div>

            {% if error %}
            <div class="tip" style="background:#fff1f2;border-color:rgba(220,38,38,0.22);color:#991b1b;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/admin/login" style="margin-top:12px;display:flex;flex-direction:column;gap:10px;">
                <div>
                    <label class="field-label" for="username">Username</label>
                    <input class="text-input" id="username" name="username" type="text" autocomplete="username" required />
                </div>
                <div>
                    <label class="field-label" for="password">Password</label>
                    <input class="text-input" id="password" name="password" type="password" autocomplete="current-password" required />
                </div>
                <button class="primary-btn" type="submit">Login</button>
            </form>
        </section>
    </main>
</body>
</html>
